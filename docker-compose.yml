services:
  database:
    image: postgres:18.0
    restart: unless-stopped
    ports:
      - "${DB_HOST}:${DB_PORT}:5432"
    env_file:
      - .env
    networks:
      - postgres-network
    volumes:
      - ./db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "${PGADMIN_HOST}:${PGADMIN_PORT}:80"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - postgres-network
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST}:${MINIO_API_PORT}:9000"
      - "${MINIO_HOST}:${MINIO_CONSOLE_PORT}:9001"
    env_file:
      - .env
    networks:
      - postgres-network
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  postgres-network:
    driver: bridge